<!DOCTYPE html>
<!-- Lemminge 3D – Prototyp: ein Lemming in Third-Person-Ansicht, frei beweglich. Eigenständig, unabhängig von index.html und lemminge.html. -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lemminge 3D</title>
<style>
  html,body{ margin:0; height:100%; overflow:hidden; background:#9fd6f0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  #hint{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    background:rgba(0,40,80,.75); color:#fff; padding:8px 16px; border-radius:8px;
    font-size:0.9rem; z-index:10; pointer-events:none; text-align:center;
  }
  #back{
    position:fixed; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:0.85rem;
  }
  #back a{ color:#fff; background:rgba(0,40,80,.75); padding:6px 12px; border-radius:8px; text-decoration:none; }
</style>
</head>
<body>
<div id="hint">WASD / Pfeiltasten zum Bewegen · Maus ziehen = Kamera drehen</div>
<div id="back"><a href="lemminge.html">← Zurück zum Lemminge-Spiel</a></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
<script>
(function(){
"use strict";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd6f0);
scene.fog = new THREE.Fog(0x9fd6f0, 30, 90);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 500);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

/* ---------- Licht ---------- */
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40; sun.shadow.camera.bottom = -40;
scene.add(sun);

/* ---------- Boden ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(200, 50, 0x6b4423, 0x6b4423);
grid.position.y = 0.01;
scene.add(grid);

/* ein paar Hindernisse zur Orientierung */
const boxMat = new THREE.MeshStandardMaterial({ color: 0x5a7fb8 });
for (const [x,z] of [[8,-6],[-10,5],[14,10],[-6,-14]]) {
  const box = new THREE.Mesh(new THREE.BoxGeometry(3,3,3), boxMat);
  box.position.set(x, 1.5, z);
  box.castShadow = true; box.receiveShadow = true;
  scene.add(box);
}

/* ---------- Lemming-Charakter ---------- */
const OUTLINE_COLOR = 0x1b2733;
const OUTLINE_MAT = new THREE.MeshBasicMaterial({ color: OUTLINE_COLOR, side: THREE.BackSide });

function addOutline(mesh, scale){
  const outline = new THREE.Mesh(mesh.geometry, OUTLINE_MAT);
  outline.scale.multiplyScalar(scale);
  mesh.add(outline);
}

const lemming = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd98b3c });
const bodyDarkMat = new THREE.MeshStandardMaterial({ color: 0xb9702a });
const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x1b2733 });

// Rumpf, der beim Laufen leicht wippt/hoppelt
const torsoGroup = new THREE.Group();
lemming.add(torsoGroup);

// runder, eiförmiger Körper (Kopf und Rumpf sind beim Lemming eins)
const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 18), bodyMat);
body.position.y = 0.75;
body.scale.set(1.02, 0.98, 1.08);
body.castShadow = true;
addOutline(body, 1.06);
torsoGroup.add(body);

// riesige runde Augen – das markanteste Merkmal
for (const side of [-1, 1]) {
  const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), eyeWhiteMat);
  eyeWhite.position.set(side * 0.23, 0.92, 0.42);
  addOutline(eyeWhite, 1.1);
  torsoGroup.add(eyeWhite);

  const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.095, 12, 10), pupilMat);
  pupil.position.set(side * 0.23, 0.9, 0.58);
  torsoGroup.add(pupil);
}

// winzige Arm-Stummel
for (const side of [-1, 1]) {
  const arm = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), bodyMat);
  arm.position.set(side * 0.53, 0.55, 0.05);
  arm.scale.set(0.8, 1.1, 0.8);
  arm.castShadow = true;
  addOutline(arm, 1.15);
  torsoGroup.add(arm);
}

// kleine Füße, auf denen der runde Körper "sitzt"
const feet = [];
for (const side of [-1, 1]) {
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 8), bodyDarkMat);
  foot.position.set(side * 0.22, 0.15, 0.1);
  foot.scale.set(1, 0.6, 1.2);
  foot.castShadow = true;
  addOutline(foot, 1.12);
  torsoGroup.add(foot);
  feet.push(foot);
}

// geringelter Schwanz am Hinterteil
const tail = new THREE.Mesh(
  new THREE.TorusGeometry(0.14, 0.045, 8, 16, Math.PI * 1.4),
  bodyDarkMat
);
tail.position.set(0, 0.55, -0.48);
tail.rotation.y = Math.PI / 2;
tail.rotation.x = 0.3;
tail.castShadow = true;
addOutline(tail, 1.2);
torsoGroup.add(tail);

lemming.position.set(0, 0, 0);
scene.add(lemming);

/* ---------- Eingabe ---------- */
const keys = {};
window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

/* ---------- Kamera: Third-Person, per Maus drehbar ---------- */
let camYaw = 0;
let camDistance = 5;
let dragging = false, lastMouseX = 0;

renderer.domElement.addEventListener('mousedown', e => { dragging = true; lastMouseX = e.clientX; });
window.addEventListener('mouseup', () => { dragging = false; });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  camYaw -= (e.clientX - lastMouseX) * 0.005;
  lastMouseX = e.clientX;
});
renderer.domElement.addEventListener('wheel', e => {
  camDistance = Math.min(16, Math.max(3.5, camDistance + e.deltaY * 0.01));
}, { passive:true });

/* Touch: ziehen dreht die Kamera */
renderer.domElement.addEventListener('touchstart', e => { dragging = true; lastMouseX = e.touches[0].clientX; });
window.addEventListener('touchend', () => { dragging = false; });
window.addEventListener('touchmove', e => {
  if (!dragging) return;
  camYaw -= (e.touches[0].clientX - lastMouseX) * 0.005;
  lastMouseX = e.touches[0].clientX;
});

/* ---------- Bewegung + Loop ---------- */
const MOVE_SPEED = 6; // Einheiten/Sekunde
let facing = 0; // aktuelle Blickrichtung des Lemmings (rad)
let clock = new THREE.Clock();

function updateMovement(dt){
  let mx = 0, mz = 0;
  if (keys['w'] || keys['arrowup']) mz -= 1;
  if (keys['s'] || keys['arrowdown']) mz += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  if (mx !== 0 || mz !== 0) {
    const len = Math.hypot(mx, mz);
    mx /= len; mz /= len;

    // Bewegungsrichtung relativ zur Kamera-Blickrichtung (camYaw)
    const worldX = mx * Math.cos(camYaw) + mz * Math.sin(camYaw);
    const worldZ = -mx * Math.sin(camYaw) + mz * Math.cos(camYaw);

    lemming.position.x += worldX * MOVE_SPEED * dt;
    lemming.position.z += worldZ * MOVE_SPEED * dt;

    const targetFacing = Math.atan2(worldX, worldZ);
    let diff = targetFacing - facing;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    facing += diff * Math.min(1, dt*10);
    lemming.rotation.y = facing;

    // Lauf-Animation: kleines Hoppeln mit Stauchen/Strecken statt Gliedmaßen-Schwung
    const hop = Math.abs(Math.sin(clock.elapsedTime*9));
    torsoGroup.position.y = hop * 0.12;
    torsoGroup.scale.set(1 - hop*0.06, 1 + hop*0.1, 1 - hop*0.06);
  } else {
    torsoGroup.position.y = 0;
    torsoGroup.scale.set(1, 1, 1);
  }

  // Lemming auf dem Boden halten (einfache Begrenzung)
  lemming.position.x = Math.max(-95, Math.min(95, lemming.position.x));
  lemming.position.z = Math.max(-95, Math.min(95, lemming.position.z));
}

function updateCamera(){
  const camX = lemming.position.x + Math.sin(camYaw) * camDistance;
  const camZ = lemming.position.z + Math.cos(camYaw) * camDistance;
  const camY = lemming.position.y + 2.2;
  camera.position.lerp(new THREE.Vector3(camX, camY, camZ), 0.15);
  camera.lookAt(lemming.position.x, lemming.position.y + 0.75, lemming.position.z);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  updateMovement(dt);
  updateCamera();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

})();
</script>
</body>
</html>
